name: AI Talent Screener Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-architecture:
    name: Backend Quality, Clean Architecture & Pytest Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dev dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Run Ruff lint checks
        run: ruff check src tests

      - name: Run strict static type check (mypy --strict)
        run: mypy --strict src tests

      - name: Verify Import-Linter layer and bounded-context contracts
        run: PYTHONPATH=src lint-imports

      - name: Run full pytest suite with branch coverage
        run: pytest --cov=talent_screener --cov-fail-under=90

  frontend-quality-and-tests:
    name: Frontend Strict TypeScript, Boundary AST & Vitest Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Run strict TypeScript check (tsc --noEmit)
        run: npm run typecheck

      - name: Run Vitest unit, integration & Clean Architecture AST tests
        run: npm run coverage

      - name: Verify Next.js App Router production build
        run: npm run build
