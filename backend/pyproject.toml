[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "talent-screener"
version = "0.1.0"
description = "Enterprise AI Talent Screener & Stateful Adaptive Technical Interviewer (Core Domain & Ports)"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "import-linter>=2.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --strict-markers --cov=talent_screener --cov-report=term-missing"
markers = [
    "architecture: Architectural fitness and Clean Architecture boundary tests",
    "integration: End-to-end integration tests across application and infrastructure adapters",
    "unit: Pure domain and port unit tests",
]

[tool.coverage.run]
source = ["src/talent_screener"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
mypy_path = "src"
packages = ["talent_screener"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "C4",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["talent_screener"]

[tool.importlinter]
root_package = "talent_screener"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Clean Architecture Inward Dependency Rule"
type = "layers"
layers = [
    "talent_screener.composition_root",
    "talent_screener.presentation",
    "talent_screener.infrastructure",
    "talent_screener.application",
    "talent_screener.domain",
]

[[tool.importlinter.contracts]]
name = "Domain and Application Zero-Framework Purity"
type = "forbidden"
source_modules = [
    "talent_screener.domain",
    "talent_screener.application",
]
forbidden_modules = [
    "talent_screener.infrastructure",
    "talent_screener.presentation",
    "talent_screener.composition_root",
    "pydantic",
    "fastapi",
    "sqlalchemy",
    "langchain",
    "langgraph",
    "celery",
    "redis",
    "qdrant_client",
    "httpx",
]

[[tool.importlinter.contracts]]
name = "Domain Cannot Depend On Application"
type = "forbidden"
source_modules = [
    "talent_screener.domain",
]
forbidden_modules = [
    "talent_screener.application",
]

[[tool.importlinter.contracts]]
name = "Bounded Context Independence"
type = "independence"
modules = [
    "talent_screener.domain.contexts.recruitment",
    "talent_screener.domain.contexts.document_intelligence",
    "talent_screener.domain.contexts.live_interview",
    "talent_screener.domain.contexts.evaluation_analytics",
    "talent_screener.domain.contexts.identity_governance",
]
