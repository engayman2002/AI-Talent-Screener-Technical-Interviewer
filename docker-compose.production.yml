services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: talent_screener
      POSTGRES_USER: talent_screener
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-in-production}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent_screener -d talent_screener"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6333/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      TS_ROLE: api
      TS_NODE_ID: api-node-1
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DB_DSN: /var/lib/talent_screener/runtime.db
      DEMO_SEED_ENABLED: "true"
      POSTGRES_DSN: postgresql://talent_screener:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/talent_screener
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "8000:8000"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      TS_ROLE: worker
      TS_NODE_ID: worker-pool-1
      POSTGRES_DSN: postgresql://talent_screener:${POSTGRES_PASSWORD:-change-me-in-production}@postgres:5432/talent_screener
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    command:
      [
        "python",
        "-c",
        "import asyncio, signal; from talent_screener.composition_root import build_production_container; b=build_production_container(); stop=asyncio.Event(); loop=asyncio.new_event_loop(); asyncio.set_event_loop(loop); loop.add_signal_handler(signal.SIGTERM, stop.set); loop.run_until_complete(stop.wait())",
      ]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend-api:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend-api:8000
      NEXT_PUBLIC_API_BASE_URL: /api
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

volumes:
  pg_data:
  redis_data:
  qdrant_data:
